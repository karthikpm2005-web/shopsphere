  <script>
    // 1. Audio Synthesizer for Smartphone SMS Chime Ringtone
    function playSMSChimeSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch(e) {}
    }

    // 2. Native Windows / Browser System Pop-up Notification
    function dispatchNativeSystemNotification(title, message) {
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          new Notification(title, { body: message });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(p => {
            if (p === 'granted') new Notification(title, { body: message });
          });
        }
      }
    }

    // 3. Real Email Dispatch via Formspree API (Sends actual Email to karthikpm2005@gmail.com)
    async function triggerRealEmailDispatch(toEmail, subjectText, messageText) {
      try {
        await fetch('https://formspree.io/f/mqkvgqqa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: toEmail, subject: subjectText, message: messageText })
        }).catch(() => {});
      } catch(e) {}
    }

    // Request System Notification permission on load
    if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
      Notification.requestPermission();
    }

          const [cart, setCart] = useState(() => {

          const [toastStack, setToastStack] = useState([]);

          useEffect(() => { try { localStorage.setItem('ss_cart', JSON.stringify(cart)); } catch(e){} }, [cart]);

          const pushNotification = (title, msg, type = 'SMS') => {
            // Play Audio Chime Sound
            playSMSChimeSound();

            // Dispatch Native OS Windows Desktop Notification
            dispatchNativeSystemNotification(title, msg);

            // Add to live UI toast banner
            const newToast = { id: Date.now() + Math.random(), title, msg, type };
            setToastStack(prev => [newToast, ...prev].slice(0, 3));
            setTimeout(() => {
              setToastStack(prev => prev.filter(t => t.id !== newToast.id));
            }, 6000);
          };

          const addToCart = (p) => {
            setCart(prev => {
              const idx = prev.findIndex(i => i.id === p.id);
              if (idx > -1) { const copy = [...prev]; copy[idx].qty += 1; return copy; }
              return [...prev, { ...p, qty: 1 }];
            });
            pushNotification('🛒 SHOPPING CART UPDATE', `Added "${p.title.slice(0, 25)}..." to your cart.`, 'SMS');

          const removeCart = (id) => setCart(prev => prev.filter(i => i.id !== id));

                ),
                h('div', { className: 'modal-body' },
                  h('div', { className: 'profile-contact-badge' },
                    '📲 SMS alerts will be dispatched to: ', h('strong', null, userProfile.phone), ' • Receipts to: ', h('strong', null, userProfile.email)
                  ),
                  h('div', { className: 'payment-options-layout' },
                    h('div', { className: 'payment-tabs-sidebar' },
                      h('button', { className: 'pay-tab-btn ' + (payMethod === 'upi' ? 'active' : ''), onClick: () => setPayMethod('upi') }, '📱 UPI (GPay/PhonePe)'),
                      h('button', { className: 'pay-tab-btn ' + (payMethod === 'card' ? 'active' : ''), onClick: () => setPayMethod('card') }, '💳 Credit / Debit Card'),
                      h('button', { className: 'pay-tab-btn ' + (payMethod === 'netbanking' ? 'active' : ''), onClick: () => setPayMethod('netbanking') }, '🏦 Net Banking'),
                      h('button', { className: 'pay-tab-btn ' + (payMethod === 'cod' ? 'active' : ''), onClick: () => setPayMethod('cod') }, '💵 Cash on Delivery (COD)'),
                      h('button', { className: 'pay-tab-btn ' + (payMethod === 'wallet' ? 'active' : ''), onClick: () => setPayMethod('wallet') }, '👛 ShopSphere Pay Balance')
                    ),
                    h('div', { className: 'payment-tab-content' },
                      payMethod === 'upi' && h('div', null,
                        h('h4', null, 'Pay via UPI Instant'),
                        h('p', { style: { fontSize: '0.85rem', color: 'var(--text-sub)' } }, 'Scan QR code using GPay, PhonePe, or Paytm:'),
                        h('div', { className: 'qr-box' },
                          h('span', null, '📷 Dynamic QR Code Generator'),
                          h('strong', { className: 'qr-amt' }, 'Pay ' + fmtRs(totalAmt))
                        ),
                        h('div', { style: { marginTop: '1rem' } },
                          h('label', { style: { fontSize: '0.8rem', fontWeight: 700 } }, 'Enter UPI ID / VPA:'),
                          h('input', { className: 'info-input', value: upiVpa, onChange: e => setUpiVpa(e.target.value) })
                        )
                      ),

                      payMethod === 'card' && h('div', null,
                        h('h4', null, 'Credit / Debit Card'),
                        h('label', { style: { fontSize: '0.8rem', fontWeight: 700 } }, 'Card Number'),
                        h('input', { className: 'info-input', value: cardNo, onChange: e => setCardNo(e.target.value) }),
                        h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem', marginTop: '0.5rem' } },
                          h('input', { className: 'info-input', defaultValue: '08/29', placeholder: 'MM/YY' }),
                          h('input', { className: 'info-input', type: 'password', defaultValue: '•••', placeholder: 'CVV' })
                        )
                      ),

                      payMethod === 'netbanking' && h('div', null,
                        h('h4', null, 'Net Banking'),
                        h('select', { className: 'info-input', value: selectedBank, onChange: e => setSelectedBank(e.target.value) },
                          h('option', null, 'HDFC Bank'),
                          h('option', null, 'ICICI Bank'),
                          h('option', null, 'State Bank of India (SBI)'),
                          h('option', null, 'Axis Bank'),
                          h('option', null, 'Kotak Mahindra Bank')
                        )
                      ),

                      payMethod === 'cod' && h('div', null,
                        h('h4', null, 'Cash on Delivery (COD)'),
                        h('p', { style: { fontSize: '0.85rem', color: 'var(--text-sub)' } }, 'Enter 4-digit confirmation OTP sent to ' + userProfile.phone + ':'),
                        h('input', { className: 'info-input', value: codOtp, onChange: e => setCodOtp(e.target.value), placeholder: 'Enter OTP (e.g. 8492)' })
                      ),

                      payMethod === 'wallet' && h('div', null,
                        h('h4', null, 'ShopSphere Pay Balance'),
                        h('p', { style: { color: '#388e3c', fontWeight: 800 } }, 'Available Balance: ₹1,50,000')
                      )
                    )
                  ),
                  h('div', { className: 'modal-actions-bar' },
                    h('button', { className: 'btn-secondary', onClick: () => setShowCheckout(false) }, 'Cancel'),
                    h('button', { className: 'btn-primary success-btn', onClick: handleConfirmPayment }, 'PAY ' + fmtRs(totalAmt) + ' & CONFIRM ORDER →')
                  )
                )
              )
            ),

            /* 5-STAGE LIVE TRACKING MODAL */
            trackModalOrd && h('div', { className: 'modal-backdrop' },
              h('div', { className: 'tracking-modal-container' },
                h('div', { className: 'modal-header' },
                  h('div', null,
                    h('h3', null, '🚚 Live Order Shipment Tracking'),
                    h('p', { style: { fontSize: '0.8rem', color: 'var(--text-sub)' } }, 'Order #' + trackModalOrd.id + ' • Waybill ID: EX-849201')
                  ),
                  h('button', { className: 'modal-close-btn', onClick: () => setActiveTrackOrd(null) }, '✕')
                ),
                h('div', { className: 'modal-body' },
                  h('div', { className: 'tracking-timeline-box' },
                    h('div', { className: 'timeline-progress-bar' },
                      h('div', { className: 'timeline-progress-fill', style: { width: (((trackModalOrd.trackingStage || 1) - 1) / 4 * 100) + '%' } })
                    ),
                    h('div', { className: 'timeline-steps-nodes' },
                      ['Confirmed', 'Packed', 'Shipped', 'Out for Delivery', 'Delivered'].map((st, i) => {
                        const comp = (trackModalOrd.trackingStage || 1) >= (i + 1);
                        const curr = (trackModalOrd.trackingStage || 1) === (i + 1);
                        return h('div', { key: i, className: 'timeline-node-item ' + (comp ? 'completed ' : '') + (curr ? 'current' : '') },
                          h('div', { className: 'node-icon-circle' }, (i + 1)),
                          h('span', { className: 'node-title' }, st)
                        );
                      })
                    )
                  ),

                  h('div', { className: 'courier-agent-card' },
                    h('div', { className: 'agent-info' },
                      h('h4', null, 'Delivery Executive: ' + (trackModalOrd.tracking?.agentName || 'Rajesh Kumar')),
                      h('p', null, 'Partner: ExpressLogistics India • Phone: ' + (trackModalOrd.tracking?.agentPhone || '+91 98123 45678'))
                    ),
                    h('button', { className: 'btn-call-agent', onClick: () => alert('Calling delivery executive at ' + (trackModalOrd.tracking?.agentPhone || '+91 98123 45678') + '...') }, '📞 Call Agent')
                  ),

                  (trackModalOrd.trackingStage || 1) < 5 && h('button', { className: 'btn-simulate-next', onClick: () => {
                    updateOrderStatus(trackModalOrd.id);
                    pushNotification(`💬 REAL SMS DISPATCH TO ${trackModalOrd.customer.phone}`, `Order #${trackModalOrd.id} status updated live!`, 'SMS');
                    pushNotification(`✉️ REAL EMAIL DISPATCH TO ${trackModalOrd.customer.email}`, `Order #${trackModalOrd.id} status updated live!`, 'EMAIL');
                  } }, '⚡ Advance Shipment Stage & Send SMS/Email Alert →'),

                  h('h4', { style: { marginTop: '1.5rem', marginBottom: '0.5rem' } }, '📲 Customer Notification Logs'),
                  h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.5rem', maxHeight: '200px', overflowY: 'auto' } },
                    (trackModalOrd.notifications || []).map((n, idx) => h('div', { key: idx, className: 'log-entry-card ' + (n.type === 'SMS' ? 'sms-log' : 'email-log') },
                      h('div', { style: { display: 'flex', justifyContent: 'space-between', fontWeight: 800, fontSize: '0.75rem' } },
                        h('span', null, n.type + ' to ' + n.recipient),
                        h('span', null, n.time)
                      ),
                      h('p', null, n.message)
                    ))
                  )
                )
              )
            ),

            /* Footer */
            h('footer', { className: 'marketplace-footer' },
              h('p', null, '© 2026 ShopSphere Internet Private Limited. All rights reserved.')
            )
          );
        }

        function App() {
          return h(CartProvider, null, h(WishProvider, null, h(AppMain)));
        }

        ReactDOM.createRoot(document.getElementById('root')).render(h(App));
      }
    })();
  </script>
</body>
</html>
