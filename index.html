    // --- 1. HELPERS ---
    function formatCurrency(amount) {
      if (typeof amount !== 'number' || isNaN(amount)) return '₹0';
      return '₹' + Math.round(amount).toLocaleString('en-IN');
    }

    function formatRating(rating) {
      if (!rating) return '★ 4.5';
      const rateVal = typeof rating.rate === 'number' ? rating.rate.toFixed(1) : '4.5';
      const countVal = typeof rating.count === 'number' ? rating.count.toLocaleString('en-IN') : '120';
      return `★ ${rateVal} (${countVal})`;
    }

    function calculateDiscount(price, originalPrice) {
      if (!originalPrice || originalPrice <= price) return null;
      const pct = Math.round(((originalPrice - price) / originalPrice) * 100);
      return `${pct}% off`;
    }

    function truncateText(text, maxLength = 55) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.slice(0, maxLength).trim() + '...';
    }

    function sortProducts(products, sortBy) {
      if (!Array.isArray(products)) return [];
      const list = [...products];
      switch (sortBy) {
        case 'price-low-high': return list.sort((a, b) => a.price - b.price);
        case 'price-high-low': return list.sort((a, b) => b.price - a.price);
        case 'rating-high': return list.sort((a, b) => (b.rating?.rate || 0) - (a.rating?.rate || 0));
        case 'discount': return list.sort((a, b) => (b.discount || 0) - (a.discount || 0));
        case 'name-asc': return list.sort((a, b) => a.title.localeCompare(b.title));
        default: return list;
      }
    }

    // --- 3. CONTEXTS ---
    const CartContext = createContext();
    const WishlistContext = createContext();

    function CartProvider({ children }) {
      const [cartItems, setCartItems] = useState(() => {
        try {
          const saved = localStorage.getItem('shopsphere_cart_v1');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(prev => prev === msg ? null : prev), 3500);
      };

      useEffect(() => {
        try { localStorage.setItem('shopsphere_cart_v1', JSON.stringify(cartItems)); } catch (e) {}
      }, [cartItems]);

      const addToCart = (p, qty = 1) => {
        setCartItems(prev => {
          const idx = prev.findIndex(i => i.id === p.id);
          if (idx > -1) {
            const updated = [...prev];
            updated[idx] = { ...updated[idx], quantity: updated[idx].quantity + qty };
            return updated;
          }
          return [...prev, { ...p, quantity: qty }];
        });
        showToast(`🛒 Added ${qty} × "${p.title.slice(0, 25)}..." to cart!`);
      };

      const removeFromCart = id => {
        setCartItems(prev => prev.filter(i => i.id !== id));
        showToast(`🗑️ Item removed from cart.`);
      };

      const increaseQuantity = id => setCartItems(prev => prev.map(i => i.id === id ? { ...i, quantity: i.quantity + 1 } : i));
      const decreaseQuantity = id => setCartItems(prev => prev.map(i => i.id === id ? { ...i, quantity: i.quantity - 1 } : i).filter(i => i.quantity > 0));
      const clearCart = () => setCartItems([]);

      const totalItems = cartItems.reduce((s, i) => s + i.quantity, 0);
      const subtotalPrice = cartItems.reduce((s, i) => s + i.price * i.quantity, 0);

      return (
        <CartContext.Provider value={{ cartItems, totalItems, subtotalPrice, toastMsg, addToCart, removeFromCart, increaseQuantity, decreaseQuantity, clearCart }}>
          {children}
        </CartContext.Provider>
      );
    }

    function WishlistProvider({ children }) {
      const [wishlistItems, setWishlistItems] = useState(() => {
        try { return JSON.parse(localStorage.getItem('shopsphere_wishlist_v1')) || []; } catch (e) { return []; }
      });
      const [recentlyViewed, setRecentlyViewed] = useState(() => {
        try { return JSON.parse(localStorage.getItem('shopsphere_recent_v1')) || []; } catch (e) { return []; }
      });
      const [orders, setOrders] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('shopsphere_orders_v1')) || [
            { id: 'SS10001', date: '05 Sep 2026', status: 'Delivered', items: [{ title: 'Samsung Galaxy S24 Ultra 5G', price: 129999, quantity: 1, image: 'https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?auto=format&fit=crop&w=600&q=80' }], total: 129999 }
          ];
        } catch (e) { return []; }
      });

      useEffect(() => { try { localStorage.setItem('shopsphere_wishlist_v1', JSON.stringify(wishlistItems)); } catch (e) {} }, [wishlistItems]);
      useEffect(() => { try { localStorage.setItem('shopsphere_recent_v1', JSON.stringify(recentlyViewed)); } catch (e) {} }, [recentlyViewed]);
      useEffect(() => { try { localStorage.setItem('shopsphere_orders_v1', JSON.stringify(orders)); } catch (e) {} }, [orders]);

      const addToWishlist = p => setWishlistItems(prev => prev.some(i => i.id === p.id) ? prev : [...prev, p]);
      const removeFromWishlist = id => setWishlistItems(prev => prev.filter(i => i.id !== id));
      const isInWishlist = id => wishlistItems.some(i => i.id === id);

      const addRecentlyViewed = p => {
        if (!p || !p.id) return;
        setRecentlyViewed(prev => [p, ...prev.filter(i => i.id !== p.id)].slice(0, 10));
      };

      const addOrder = (items, total) => {
        const o = { id: `SS${Math.floor(10000 + Math.random() * 90000)}`, date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }), status: 'In Transit', items, total };
        setOrders(prev => [o, ...prev]);
        return o;
      };

      return (
        <WishlistContext.Provider value={{ wishlistItems, recentlyViewed, orders, addToWishlist, removeFromWishlist, isInWishlist, addRecentlyViewed, addOrder }}>
          {children}
        </WishlistContext.Provider>
      );
    }

    function useCart() { return useContext(CartContext); }
    function useWishlist() { return useContext(WishlistContext); }

    // --- 4. MARKETPLACE HEADER & COMPONENTS ---
    function Navbar({ activePage, onNavigate, onSearch }) {
      const { totalItems } = useCart();
      const { wishlistItems } = useWishlist();
      const [term, setTerm] = useState('');
      const [suggestions, setSuggestions] = useState([]);
      const [showSug, setShowSug] = useState(false);
      const [open, setOpen] = useState(false);
      const searchRef = useRef(null);

      useEffect(() => {
        const q = term.trim().toLowerCase();
        if (q.length < 2) { setSuggestions([]); setShowSug(false); return; }
        const matches = INDIAN_PRODUCTS.filter(p => p.title.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)).slice(0, 5);
        setSuggestions(matches);
        setShowSug(matches.length > 0);
      }, [term]);

      const submitSearch = e => {
        if (e) e.preventDefault();
        if (onSearch) onSearch(term);
        setShowSug(false);
      };

      const clickSug = p => {
        onNavigate('product-details', p.id);
        setTerm('');
        setShowSug(false);
      };

      const nav = (p, e) => {
        if (e) e.preventDefault();
        onNavigate(p);
        setOpen(false);
      };

      return (
        <header className="marketplace-header">
          <div className="header-top-container">
            <a href="#/" className="header-brand" onClick={(e) => nav('home', e)}>
              <div className="brand-logo-text"><span className="brand-icon">🛍️</span><span>ShopSphere</span></div>
              <span className="brand-tagline">Explore Plus ✦</span>
            </a>
            <div className="header-search-wrapper" ref={searchRef}>
              <form className="header-search-form" onSubmit={submitSearch}>
                <input type="text" className="header-search-input" placeholder="Search for products, brands and categories..." value={term} onChange={e => setTerm(e.target.value)} onFocus={() => suggestions.length > 0 && setShowSug(true)} />
                <button type="submit" className="header-search-btn">🔍</button>
              </form>
              {showSug && (
                <ul className="search-suggestions-dropdown">
                  {suggestions.map(p => (
                    <li key={p.id} className="suggestion-item" onClick={() => clickSug(p)}>
                      <img src={p.image} alt={p.title} className="suggestion-img" />
                      <div className="suggestion-info">
                        <span className="suggestion-title">{p.title}</span>
                        <span className="suggestion-meta">{p.brand} • in {p.category}</span>
                      </div>
                    </li>
                  ))}
                </ul>
              )}
            </div>
            <div className={`header-actions ${open ? 'open' : ''}`}>
              <a href="#/account" className={`header-action-btn ${activePage === 'account' ? 'active' : ''}`} onClick={e => nav('account', e)}>👤 Profile</a>
              <a href="#/orders" className={`header-action-btn ${activePage === 'orders' ? 'active' : ''}`} onClick={e => nav('orders', e)}>📦 Orders</a>
              <a href="#/wishlist" className="header-action-btn badge-btn" onClick={e => nav('wishlist', e)}>
                ❤️ Wishlist {wishlistItems.length > 0 && <span className="action-badge red">{wishlistItems.length}</span>}
              </a>
              <a href="#/cart" className="header-action-btn badge-btn cart-btn-highlight" onClick={e => nav('cart', e)}>
                🛒 Cart <span className="action-badge yellow">{totalItems}</span>
              </a>
            </div>
            <button className="mobile-menu-toggle" onClick={() => setOpen(!open)}>{open ? '✕' : '☰'}</button>
          </div>
        </header>
      );
    }

    function CategoryBar({ selectedCategory, onSelectCategory }) {
      return (
        <div className="category-bar-wrapper">
          <div className="category-bar-inner">
            {CATEGORIES_LIST.map(cat => (
              <button key={cat.id} type="button" className={`category-item-btn ${selectedCategory === cat.name ? 'active' : ''}`} onClick={() => onSelectCategory(cat.name === 'All Categories' ? 'all' : cat.name)}>
                <span className="category-item-icon">{cat.icon}</span>
                <span className="category-item-name">{cat.name}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function HeroCarousel({ onNavigateCategory }) {
      const [slideIdx, setSlideIdx] = useState(0);
      const slides = [
        { title: "BIG SHOPPING DAYS SALE", subtitle: "Up to 70% OFF on Electronics & Gadgets", tag: "⚡ LIVE NOW • ENDS IN 24 HOURS", bg: "linear-gradient(135deg, #1e1b4b, #311b92, #4a148c)", image: "https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=800&q=80", target: "Electronics" },
        { title: "NEXT-GEN SMARTPHONES LAUNCH", subtitle: "Galaxy S24 Ultra & iPhone 15 Pro Max", tag: "🔥 EXTRA 10% BANK DISCOUNT", bg: "linear-gradient(135deg, #0f172a, #1e293b, #0369a1)", image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80", target: "Mobiles" },
        { title: "FASHION FESTIVAL 2026", subtitle: "Kurtas, Shirts & Sneakers Min 50% OFF", tag: "🏷️ FREE EXPRESS DELIVERY", bg: "linear-gradient(135deg, #831843, #9d174d, #be185d)", image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80", target: "Men's Fashion" }
      ];

      useEffect(() => {
        const timer = setInterval(() => setSlideIdx(prev => (prev + 1) % slides.length), 5000);
        return () => clearInterval(timer);
      }, []);

      const s = slides[slideIdx];
      return (
        <div className="hero-carousel-container" style={{ background: s.bg }}>
          <div className="hero-carousel-content">
            <span className="carousel-tag">{s.tag}</span>
            <h1 className="carousel-title">{s.title}</h1>
            <p className="carousel-subtitle">{s.subtitle}</p>
            <button className="carousel-cta-btn" onClick={() => onNavigateCategory(s.target)}>Explore Now →</button>
          </div>
          <div className="hero-carousel-image-box"><img src={s.image} alt={s.title} className="carousel-img" /></div>
          <button className="carousel-arrow prev" onClick={() => setSlideIdx(p => (p - 1 + slides.length) % slides.length)}>‹</button>
          <button className="carousel-arrow next" onClick={() => setSlideIdx(p => (p + 1) % slides.length)}>›</button>
        </div>
      );
    }

    function ProductCard({ product, onSelect }) {
      const { addToCart } = useCart();
      const { addToWishlist, removeFromWishlist, isInWishlist } = useWishlist();
      if (!product) return null;

      const isWish = isInWishlist(product.id);
      const discountText = calculateDiscount(product.price, product.originalPrice) || (product.discount ? `${product.discount}% off` : null);

      return (
        <article className="marketplace-card" onClick={() => onSelect(product.id)}>
          <div className="card-top-image-box">
            {discountText && <span className="discount-badge-pill">{discountText}</span>}
            <button className={`wishlist-heart-btn ${isWish ? 'active' : ''}`} onClick={e => { e.stopPropagation(); isWish ? removeFromWishlist(product.id) : addToWishlist(product); }}>
              {isWish ? '❤️' : '🤍'}
            </button>
            <img src={product.image} alt={product.title} className="card-main-img" loading="lazy" />
          </div>
          <div className="card-content-body">
            <div className="brand-category-row"><span className="brand-label">{product.brand || 'ShopSphere'}</span><span className="delivery-tag">Free Delivery</span></div>
            <h3 className="card-title">{truncateText(product.title, 55)}</h3>
            <div className="card-rating-row"><span className="rating-pill">{formatRating(product.rating)}</span></div>
            <div className="card-price-row">
              <span className="current-price">{formatCurrency(product.price)}</span>
              {product.originalPrice && product.originalPrice > product.price && <span className="original-price">{formatCurrency(product.originalPrice)}</span>}
            </div>
            <div className="card-actions-row">
              <button className="btn-card-details" onClick={() => onSelect(product.id)}>Details</button>
              <button className="btn-card-add" onClick={e => { e.stopPropagation(); addToCart(product, 1); }}>+ Add</button>
            </div>
          </div>
        </article>
      );
    }

    function ProductSection({ title, subtitle, products, onSelect }) {
      if (!products || products.length === 0) return null;
      return (
        <section className="marketplace-section">
          <div className="section-header-bar">
            <div><h2 className="marketplace-section-title">{title}</h2>{subtitle && <p className="marketplace-section-sub">{subtitle}</p>}</div>
          </div>
          <div className="product-grid">
            {products.map(p => <ProductCard key={p.id} product={p} onSelect={onSelect} />)}
          </div>
        </section>
      );
    }

    // --- 5. PAGES ---
    function HomePage({ onNavigate, onSelect, onSelectCat }) {
      const deals = INDIAN_PRODUCTS.filter(p => p.discount >= 10).slice(0, 4);
      const mobiles = INDIAN_PRODUCTS.filter(p => p.category === 'Mobiles').slice(0, 4);
      const electronics = INDIAN_PRODUCTS.filter(p => p.category === 'Electronics' || p.category === 'Laptops').slice(0, 4);
      const fashion = INDIAN_PRODUCTS.filter(p => p.category.includes('Fashion')).slice(0, 4);
      const appliances = INDIAN_PRODUCTS.filter(p => p.category === 'Appliances' || p.category === 'TVs').slice(0, 4);
      const { recentlyViewed } = useWishlist();

      return (
        <div>
          <CategoryBar selectedCategory="all" onSelectCategory={onSelectCat} />
          <HeroCarousel onNavigateCategory={onSelectCat} />
          <div className="bank-offers-grid">
            <div className="bank-offer-card"><h4>HDFC BANK</h4><p>10% Instant Discount on Credit Cards</p></div>
            <div className="bank-offer-card"><h4>ICICI BANK</h4><p>Up to ₹3,000 Off on No Cost EMI</p></div>
            <div className="bank-offer-card"><h4>FREE SHIPPING</h4><p>Zero Delivery Charges on Orders Over ₹500</p></div>
          </div>

          <ProductSection title="🔥 Deals of the Day" subtitle="Massive price drops on top-rated products" products={deals} onSelect={onSelect} />
          <ProductSection title="📱 Top Smartphones & Mobiles" subtitle="Samsung, Apple, OnePlus & Xiaomi" products={mobiles} onSelect={onSelect} />
          <ProductSection title="💻 Laptops & Electronics" subtitle="MacBooks, ROG Gaming & Headphones" products={electronics} onSelect={onSelect} />
          <ProductSection title="👗 Fashion Trends" subtitle="Kurtas, Cotton Shirts & Sneakers" products={fashion} onSelect={onSelect} />
          <ProductSection title="📺 TVs & Home Appliances" subtitle="LG OLED 4K & Washing Machines" products={appliances} onSelect={onSelect} />
          {recentlyViewed.length > 0 && <ProductSection title="👁️ Recently Viewed Products" products={recentlyViewed.slice(0, 4)} onSelect={onSelect} />}
        </div>
      );
    }

    function ProductsPage({ onSelect, initialCat, searchQuery }) {
      const [cat, setCat] = useState(initialCat);
      const [brand, setBrand] = useState('all');
      const [priceRange, setPriceRange] = useState('all');
      const [sortBy, setSortBy] = useState('default');

      useEffect(() => { setCat(initialCat); }, [initialCat]);

      const filtered = useMemo(() => {
        return INDIAN_PRODUCTS.filter(p => {
          const q = searchQuery.trim().toLowerCase();
          if (q && !p.title.toLowerCase().includes(q) && !p.brand.toLowerCase().includes(q) && !p.category.toLowerCase().includes(q)) return false;
          if (cat !== 'all' && p.category.toLowerCase() !== cat.toLowerCase()) return false;
          if (brand !== 'all' && p.brand.toLowerCase() !== brand.toLowerCase()) return false;
          if (priceRange === 'under-500' && p.price >= 500) return false;
          if (priceRange === '500-1000' && (p.price < 500 || p.price > 1000)) return false;
          if (priceRange === '1000-5000' && (p.price < 1000 || p.price > 5000)) return false;
          if (priceRange === '5000-25000' && (p.price < 5000 || p.price > 25000)) return false;
          if (priceRange === 'above-25000' && p.price < 25000) return false;
          return true;
        });
      }, [searchQuery, cat, brand, priceRange]);

      const sorted = useMemo(() => sortProducts(filtered, sortBy), [filtered, sortBy]);

      return (
        <div>
          <CategoryBar selectedCategory={cat} onSelectCategory={setCat} />
          <div className="catalog-layout">
            <aside className="filter-sidebar">
              <div className="filter-sidebar-header"><h3 className="filter-title">Filters</h3><button className="btn-clear-filters" onClick={() => { setCat('all'); setBrand('all'); setPriceRange('all'); setSortBy('default'); }}>Clear</button></div>
              <div className="filter-group"><h4 className="filter-group-title">Brand</h4><select className="filter-select" value={brand} onChange={e => setBrand(e.target.value)}><option value="all">All Brands</option><option value="Samsung">Samsung</option><option value="Apple">Apple</option><option value="OnePlus">OnePlus</option><option value="Xiaomi">Xiaomi</option><option value="Sony">Sony</option><option value="LG">LG</option></select></div>
              <div className="filter-group"><h4 className="filter-group-title">Price Range</h4>
                <div className="radio-list">
                  {[{ label: 'All Prices', val: 'all' }, { label: 'Under ₹500', val: 'under-500' }, { label: '₹1,000–₹5,000', val: '1000-5000' }, { label: '₹25,000+', val: 'above-25000' }].map(r => (
                    <label key={r.val} className="radio-label"><input type="radio" name="pr" checked={priceRange === r.val} onChange={() => setPriceRange(r.val)} /><span>{r.label}</span></label>
                  ))}
                </div>
              </div>
            </aside>
            <div className="catalog-main-content">
              <div className="catalog-header-bar">
                <div><h1 className="catalog-title">{cat === 'all' ? 'All Products' : cat}</h1><p className="catalog-subtitle">Showing {sorted.length} products</p></div>
                <select className="sort-dropdown-select" value={sortBy} onChange={e => setSortBy(e.target.value)}>
                  <option value="default">Relevance</option>
                  <option value="price-low-high">Price: Low to High</option>
                  <option value="price-high-low">Price: High to Low</option>
                  <option value="rating-high">Rating</option>
                </select>
              </div>
              <div className="product-grid">{sorted.map(p => <ProductCard key={p.id} product={p} onSelect={onSelect} />)}</div>
            </div>
          </div>
        </div>
      );
    }

    function ProductDetailsPage({ productId, onNavigate }) {
      const { addToCart } = useCart();
      const { addToWishlist, removeFromWishlist, isInWishlist, addRecentlyViewed } = useWishlist();
      const p = INDIAN_PRODUCTS.find(i => i.id === Number(productId)) || INDIAN_PRODUCTS[0];

      useEffect(() => { addRecentlyViewed(p); }, [productId]);

      const isWish = isInWishlist(p.id);
      return (
        <div className="product-details-page">
          <button className="btn-back-link" onClick={() => onNavigate('products')}>← Back to Catalog</button>
          <div className="details-main-layout">
            <div className="details-gallery-box">
              <div className="details-primary-image-wrapper">
                <img src={p.image} alt={p.title} className="details-primary-img" />
                <button className={`details-wishlist-btn ${isWish ? 'active' : ''}`} onClick={() => isWish ? removeFromWishlist(p.id) : addToWishlist(p)}>{isWish ? '❤️ Wishlisted' : '🤍 Wishlist'}</button>
              </div>
            </div>
            <div className="details-info-box">
              <span className="details-brand-pill">{p.brand}</span>
              <h1 className="details-product-title">{p.title}</h1>
              <div className="details-rating-row"><span className="details-rating-pill">{formatRating(p.rating)}</span></div>
              <div className="details-price-card">
                <div className="price-tag-row">
                  <span className="details-final-price">{formatCurrency(p.price)}</span>
                  {p.originalPrice && <span className="details-original-price">{formatCurrency(p.originalPrice)}</span>}
                </div>
              </div>
              <p className="details-description">{p.description}</p>
              <div className="details-buttons-row" style={{ marginTop: '1rem' }}>
                <button className="btn-add-to-cart" onClick={() => addToCart(p, 1)}>🛒 Add to Cart</button>
                <button className="btn-buy-now" onClick={() => { addToCart(p, 1); onNavigate('cart'); }}>⚡ Buy Now</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CartPage({ onNavigate }) {
      const { cartItems, totalItems, subtotalPrice, increaseQuantity, decreaseQuantity, removeFromCart, clearCart } = useCart();
      const { addOrder } = useWishlist();
      const [placed, setPlaced] = useState(null);

      const totalOriginal = cartItems.reduce((s, i) => s + (i.originalPrice || i.price * 1.2) * i.quantity, 0);
      const discountSavings = totalOriginal - subtotalPrice;

      if (placed) {
        return (
          <div className="hero-section" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
            <span style={{ fontSize: '4rem' }}>🎉</span>
            <h1 className="hero-title">Order Placed Successfully!</h1>
            <p className="hero-subtitle">Order ID: <strong>#{placed.id}</strong> • Amount: <strong>{formatCurrency(placed.total)}</strong></p>
            <button className="hero-cta-btn" onClick={() => onNavigate('orders')}>View My Orders →</button>
          </div>
        );
      }

      if (cartItems.length === 0) {
        return (
          <div className="hero-section" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
            <span style={{ fontSize: '4rem' }}>🛒</span>
            <h1 className="hero-title">Your Cart is Empty</h1>
            <button className="hero-cta-btn" onClick={() => onNavigate('products')}>Shop Products →</button>
          </div>
        );
      }

      return (
        <div className="cart-page-layout">
          <div className="cart-items-column">
            {cartItems.map(item => (
              <div key={item.id} className="cart-item-row">
                <img src={item.image} alt={item.title} className="cart-row-img" />
                <div className="cart-row-info">
                  <h4 className="cart-row-title">{item.title}</h4>
                  <span className="row-price">{formatCurrency(item.price)}</span>
                  <div className="cart-row-actions" style={{ marginTop: '0.5rem' }}>
                    <div className="qty-control-box">
                      <button onClick={() => decreaseQuantity(item.id)}>-</button><span>{item.quantity}</span><button onClick={() => increaseQuantity(item.id)}>+</button>
                    </div>
                    <button className="btn-row-action remove" onClick={() => removeFromCart(item.id)}>Remove 🗑️</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="cart-price-details-card">
            <h3 className="price-details-title">PRICE DETAILS</h3>
            <div className="price-detail-row"><span>Price ({totalItems} items)</span><span>{formatCurrency(totalOriginal)}</span></div>
            <div className="price-detail-row discount"><span>Discount Savings</span><span>- {formatCurrency(discountSavings)}</span></div>
            <div className="price-detail-row total-amount-row"><span>Total Amount</span><span>{formatCurrency(subtotalPrice)}</span></div>
            <button className="btn-place-order" onClick={() => { const o = addOrder(cartItems, subtotalPrice); setPlaced(o); clearCart(); }}>PLACE ORDER →</button>
          </div>
        </div>
      );
    }

    function WishlistPage({ onNavigate, onSelect }) {
      const { wishlistItems, removeFromWishlist } = useWishlist();
      const { addToCart } = useCart();
      if (wishlistItems.length === 0) return <div className="hero-section" style={{ textAlign: 'center', padding: '4rem 2rem' }}><h1>Your Wishlist is Empty</h1></div>;

      return (
        <div className="product-grid">
          {wishlistItems.map(p => (
            <div key={p.id} className="marketplace-card">
              <img src={p.image} alt={p.title} style={{ height: '160px', objectFit: 'contain' }} />
              <h4 style={{ fontSize: '0.9rem', margin: '0.5rem 0' }}>{p.title}</h4>
              <span style={{ fontWeight: 800 }}>{formatCurrency(p.price)}</span>
              <button className="btn-card-add" style={{ marginTop: '0.5rem' }} onClick={() => { addToCart(p, 1); removeFromWishlist(p.id); }}>🛒 Move to Cart</button>
            </div>
          ))}
        </div>
      );
    }

    function OrdersPage() {
      const { orders } = useWishlist();
      return (
        <div className="orders-list">
          {orders.map(o => (
            <div key={o.id} className="order-card">
              <div className="order-card-header"><span>Order #{o.id} • {o.date}</span><span className="order-status-badge delivered">● {o.status}</span></div>
              <div>Total: <strong>{formatCurrency(o.total)}</strong></div>
            </div>
          ))}
        </div>
      );
    }

    function AccountPage() {
      return (
        <div className="account-card">
          <h2>My Profile</h2>
          <p><strong>Name:</strong> Karthik P M</p>
          <p><strong>Email:</strong> karthikpm2005@gmail.com</p>
          <p><strong>Status:</strong> ShopSphere Plus Member ✦</p>
        </div>
      );
    }

    // --- 7. MASTER APP ---
    function AppContent() {
      const [activePage, setActivePage] = useState('home');
      const [selectedProductId, setSelectedProductId] = useState(null);
      const [selectedCat, setSelectedCat] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const { toastMsg } = useCart();

      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash.replace(/^#\/?/, '');
          if (!hash || hash === 'home') setActivePage('home');
          else if (hash === 'products') setActivePage('products');
          else if (hash.startsWith('category/')) { setSelectedCat(decodeURIComponent(hash.split('/')[1])); setActivePage('products'); }
          else if (hash.startsWith('products/')) { setSelectedProductId(hash.split('/')[1]); setActivePage('product-details'); }
          else if (hash === 'cart') setActivePage('cart');
          else if (hash === 'wishlist') setActivePage('wishlist');
          else if (hash === 'orders') setActivePage('orders');
          else if (hash === 'account') setActivePage('account');
          else setActivePage('home');
        };
        handleHash();
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigateTo = (page, param = null) => {
        if (page === 'product-details' && param) { setSelectedProductId(param); setActivePage('product-details'); window.location.hash = `#/products/${param}`; }
        else if (page === 'category' && param) { setSelectedCat(param); setActivePage('products'); window.location.hash = `#/category/${encodeURIComponent(param)}`; }
        else { if (page === 'products' && param) setSelectedCat(param); setActivePage(page); window.location.hash = `#/${page}`; }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className="app-container">
          {toastMsg && <div className="global-toast-banner">{toastMsg}</div>}
          <Navbar activePage={activePage} onNavigate={navigateTo} onSearch={q => { setSearchQuery(q); navigateTo('products'); }} />
          <main className="main-content">
            {activePage === 'home' && <HomePage onNavigate={navigateTo} onSelect={id => navigateTo('product-details', id)} onSelectCat={cat => navigateTo('category', cat)} />}
            {activePage === 'products' && <ProductsPage onSelect={id => navigateTo('product-details', id)} initialCat={selectedCat} searchQuery={searchQuery} />}
            {activePage === 'product-details' && <ProductDetailsPage productId={selectedProductId} onNavigate={navigateTo} />}
            {activePage === 'cart' && <CartPage onNavigate={navigateTo} />}
            {activePage === 'wishlist' && <WishlistPage onNavigate={navigateTo} onSelect={id => navigateTo('product-details', id)} />}
            {activePage === 'orders' && <OrdersPage />}
            {activePage === 'account' && <AccountPage />}
          </main>
          <Footer onNavigate={navigateTo} />
        </div>
      );
    }

    function App() {
      return (
        <CartProvider>
          <WishlistProvider>
            <AppContent />
          </WishlistProvider>
        </CartProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
