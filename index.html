<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopSphere – Premium Modern E-Commerce Product Catalog. Discover electronics, jewelry, men's & women's fashion with real-time API integration, seamless shopping cart, and fast checkout.">
  <meta name="theme-color" content="#0f172a">
  <title>ShopSphere – Modern Online Shopping Catalog</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Relative CSS Link for Vite & Local Explorer -->
  <link rel="stylesheet" href="./src/index.css">

  <style>
    /* Inline Fallback Styling in case CSS link relative resolution varies */
    :root {
      --bg-primary: #090d16;
      --bg-secondary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.75);
      --bg-input: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --border-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Standalone Browser Execution Script -->
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo } = React;

    // --- 1. HELPERS ---
    function formatCurrency(amount) {
      if (typeof amount !== 'number' || isNaN(amount)) return '$0.00';
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
    }

    function formatRating(rating) {
      if (!rating || typeof rating.rate !== 'number') return '★ 4.5';
      return `★ ${rating.rate.toFixed(1)}`;
    }

    function truncateText(text, maxLength = 55) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.slice(0, maxLength).trim() + '...';
    }

    function sortProducts(products, sortBy) {
      if (!Array.isArray(products)) return [];
      const list = [...products];
      switch (sortBy) {
        case 'price-low-high': return list.sort((a, b) => a.price - b.price);
        case 'price-high-low': return list.sort((a, b) => b.price - a.price);
        case 'rating-high': return list.sort((a, b) => (b.rating?.rate || 0) - (a.rating?.rate || 0));
        case 'name-asc': return list.sort((a, b) => a.title.localeCompare(b.title));
        default: return list;
      }
    }

    // --- 2. FALLBACK DATA & API ---
    const FALLBACK_PRODUCTS = [
      { id: 1, title: "Fjallraven - Foldsack No. 1 Backpack", price: 109.95, description: "Your everyday pack for work and everyday life. Fits 15 inch laptops in its padded sleeve.", category: "men's clothing", image: "https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_.jpg", rating: { rate: 3.9, count: 120 } },
      { id: 2, title: "Mens Casual Premium Slim Fit T-Shirts", price: 22.3, description: "Slim-fit style, contrast raglan long sleeve, three-button henley placket, light weight & soft fabric.", category: "men's clothing", image: "https://fakestoreapi.com/img/71-3HjGNDUL._AC_SY879._SX._UX._SY._UY_.jpg", rating: { rate: 4.1, count: 259 } },
      { id: 3, title: "Mens Cotton Jacket", price: 55.99, description: "Great outerwear jackets for Spring/Autumn/Winter, suitable for many occasions like working, hiking, camping.", category: "men's clothing", image: "https://fakestoreapi.com/img/71li-ujtlUL._AC_UX679_.jpg", rating: { rate: 4.7, count: 500 } },
      { id: 4, title: "John Hardy Women's Legends Naga Gold Bracelet", price: 695.0, description: "From our Legends Collection, the Naga was inspired by the mythical water dragon that protects the ocean's pearl.", category: "jewelry", image: "https://fakestoreapi.com/img/71pWzhdJNwL._AC_UL640_QL65_ML3_.jpg", rating: { rate: 4.6, count: 400 } },
      { id: 5, title: "Solid Gold Petite Micropave Ring", price: 168.0, description: "Satisfaction Guaranteed. Return or exchange any order within 30 days. Handcrafted in the USA.", category: "jewelry", image: "https://fakestoreapi.com/img/61sbMiAs0mL._AC_UL640_QL65_ML3_.jpg", rating: { rate: 3.9, count: 70 } },
      { id: 6, title: "WD 2TB Elements Portable External Hard Drive", price: 64.0, description: "USB 3.0 and USB 2.0 Compatibility Fast data transfers Improve PC Performance High Capacity.", category: "electronics", image: "https://fakestoreapi.com/img/61IBBVJvSDL._AC_SY879_.jpg", rating: { rate: 3.3, count: 203 } },
      { id: 7, title: "SanDisk SSD PLUS 1TB Internal SSD", price: 109.0, description: "Easy upgrade for faster boot up, shutdown, application load and response time.", category: "electronics", image: "https://fakestoreapi.com/img/61U7T1koQqL._AC_SX679_.jpg", rating: { rate: 2.9, count: 470 } },
      { id: 8, title: "Silicon Power 256GB SSD 3D NAND A55", price: 109.0, description: "3D NAND flash technology enables high transfer speeds and overall system performance boost.", category: "electronics", image: "https://fakestoreapi.com/img/71kWymZ+c+L._AC_SX679_.jpg", rating: { rate: 4.8, count: 319 } },
      { id: 9, title: "BIYLACLESEN Women's 3-in-1 Snowboard Jacket", price: 56.99, description: "Stand collar, adjustable removable hood, adjustable cuffs, zip pockets, waterproof windproof warm coat.", category: "women's clothing", image: "https://fakestoreapi.com/img/51Y5NI-I5jL._AC_UX679_.jpg", rating: { rate: 2.6, count: 235 } },
      { id: 10, title: "Lock and Love Women's Removable Hooded Biker Jacket", price: 29.95, description: "100% POLYURETHANE(shell) 100% POLYESTER(lining). Faux leather material for style and comfort.", category: "women's clothing", image: "https://fakestoreapi.com/img/81XH0e8fefL._AC_UY879_.jpg", rating: { rate: 2.9, count: 340 } }
    ];

    async function fetchProductsFromApi() {
      try {
        const res = await fetch('https://fakestoreapi.com/products');
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) return data;
        return FALLBACK_PRODUCTS;
      } catch (e) {
        return FALLBACK_PRODUCTS;
      }
    }

    async function fetchProductByIdFromApi(id) {
      const numId = Number(id);
      try {
        const res = await fetch(`https://fakestoreapi.com/products/${numId}`);
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        if (data && data.id) return data;
        return FALLBACK_PRODUCTS.find(p => p.id === numId) || null;
      } catch (e) {
        return FALLBACK_PRODUCTS.find(p => p.id === numId) || null;
      }
    }

    // --- 3. CART CONTEXT ---
    const CartContext = createContext();

    function CartProvider({ children }) {
      const [cartItems, setCartItems] = useState(() => {
        try {
          const saved = localStorage.getItem('shopsphere_cart_v1');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('shopsphere_cart_v1', JSON.stringify(cartItems));
        } catch (e) {}
      }, [cartItems]);

      const addToCart = (product, quantity = 1) => {
        setCartItems(prev => {
          const idx = prev.findIndex(item => item.id === product.id);
          if (idx > -1) {
            const updated = [...prev];
            updated[idx] = { ...updated[idx], quantity: updated[idx].quantity + quantity };
            return updated;
          }
          return [...prev, { ...product, quantity }];
        });
      };

      const removeFromCart = (id) => setCartItems(prev => prev.filter(i => i.id !== id));
      const increaseQuantity = (id) => setCartItems(prev => prev.map(i => i.id === id ? { ...i, quantity: i.quantity + 1 } : i));
      const decreaseQuantity = (id) => setCartItems(prev => prev.map(i => i.id === id ? { ...i, quantity: i.quantity - 1 } : i).filter(i => i.quantity > 0));
      const clearCart = () => setCartItems([]);

      const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
      const subtotalPrice = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);

      return (
        <CartContext.Provider value={{ cartItems, totalItems, subtotalPrice, addToCart, removeFromCart, increaseQuantity, decreaseQuantity, clearCart }}>
          {children}
        </CartContext.Provider>
      );
    }

    function useCart() {
      return useContext(CartContext);
    }

    // --- 4. COMPONENTS ---
    function Navbar({ activePage, onNavigate }) {
      const { totalItems } = useCart();
      const [open, setOpen] = useState(false);

      const nav = (p, e) => {
        if (e) e.preventDefault();
        onNavigate(p);
        setOpen(false);
      };

      return (
        <header className="navbar">
          <div className="navbar-inner">
            <a href="#/" className="brand-logo" onClick={(e) => nav('home', e)}>
              <span className="brand-icon">🛍️</span>
              <span>ShopSphere</span>
            </a>
            <nav>
              <ul className={`nav-links ${open ? 'open' : ''}`}>
                <li><a href="#/" className={`nav-link ${activePage === 'home' ? 'active' : ''}`} onClick={(e) => nav('home', e)}>Home</a></li>
                <li><a href="#/products" className={`nav-link ${activePage === 'products' ? 'active' : ''}`} onClick={(e) => nav('products', e)}>Products</a></li>
                <li><a href="#/about" className={`nav-link ${activePage === 'about' ? 'active' : ''}`} onClick={(e) => nav('about', e)}>About</a></li>
                <li>
                  <a href="#/cart" className="cart-badge-btn" onClick={(e) => nav('cart', e)}>
                    <span>🛒 Cart</span>
                    <span className="cart-count">{totalItems}</span>
                  </a>
                </li>
              </ul>
            </nav>
            <button className="mobile-toggle" onClick={() => setOpen(!open)}>{open ? '✕' : '☰'}</button>
          </div>
        </header>
      );
    }

    function Footer({ onNavigate }) {
      const nav = (p, e) => {
        if (e) e.preventDefault();
        onNavigate(p);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="footer">
          <div className="footer-inner">
            <div>
              <a href="#/" className="brand-logo" onClick={(e) => nav('home', e)}>
                <span className="brand-icon">🛍️</span>
                <span>ShopSphere</span>
              </a>
              <p className="footer-brand-desc">Modern shopping made simple. Quality electronics, jewelry, and fashion.</p>
            </div>
            <div>
              <h4 className="footer-col-title">Quick Links</h4>
              <ul className="footer-links">
                <li><a href="#/" className="footer-link" onClick={(e) => nav('home', e)}>Home</a></li>
                <li><a href="#/products" className="footer-link" onClick={(e) => nav('products', e)}>Products</a></li>
                <li><a href="#/about" className="footer-link" onClick={(e) => nav('about', e)}>About Us</a></li>
                <li><a href="#/cart" className="footer-link" onClick={(e) => nav('cart', e)}>Shopping Cart</a></li>
              </ul>
            </div>
            <div>
              <h4 className="footer-col-title">Categories</h4>
              <ul className="footer-links">
                <li><a href="#/products" className="footer-link" onClick={(e) => nav('products', e)}>Electronics</a></li>
                <li><a href="#/products" className="footer-link" onClick={(e) => nav('products', e)}>Jewelry</a></li>
                <li><a href="#/products" className="footer-link" onClick={(e) => nav('products', e)}>Men's Clothing</a></li>
                <li><a href="#/products" className="footer-link" onClick={(e) => nav('products', e)}>Women's Clothing</a></li>
              </ul>
            </div>
            <div>
              <h4 className="footer-col-title">Customer Care</h4>
              <ul className="footer-links">
                <li><span className="footer-link">24/7 Support</span></li>
                <li><span className="footer-link">Fast Shipping</span></li>
                <li><span className="footer-link">Easy Returns</span></li>
              </ul>
            </div>
          </div>
          <div className="footer-bottom">
            <span>&copy; {new Date().getFullYear()} ShopSphere. All rights reserved.</span>
            <span>Powered by Fake Store API & React 18</span>
          </div>
        </footer>
      );
    }

    function ProductCard({ product, onSelect }) {
      const { addToCart } = useCart();
      if (!product) return null;

      const click = () => onSelect(product.id);
      const add = (e) => {
        e.stopPropagation();
        addToCart(product, 1);
      };

      return (
        <article className="product-card" onClick={click} tabIndex={0}>
          <div className="product-image-box">
            <span className="category-tag">{product.category}</span>
            <img src={product.image} alt={product.title} className="product-image" loading="lazy" />
          </div>
          <div className="product-card-body">
            <h3 className="product-title">{truncateText(product.title, 55)}</h3>
            <div className="product-rating">
              <span>{formatRating(product.rating)}</span>
              <span className="rating-count">({product.rating?.count || 0})</span>
            </div>
            <div className="product-card-footer">
              <span className="product-price">{formatCurrency(product.price)}</span>
              <div className="card-actions">
                <button type="button" className="btn-icon" onClick={click}>👁️</button>
                <button type="button" className="btn-add-cart" onClick={add}>+ Add</button>
              </div>
            </div>
          </div>
        </article>
      );
    }

    function ProductGrid({ products, onSelect }) {
      if (!products || products.length === 0) {
        return (
          <div className="error-banner">
            <p className="error-title">No products found</p>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Try adjusting your search query or category filter.</p>
          </div>
        );
      }
      return (
        <div className="product-grid">
          {products.map(p => <ProductCard key={p.id} product={p} onSelect={onSelect} />)}
        </div>
      );
    }

    function Loading({ message = "Loading ShopSphere..." }) {
      return (
        <div className="loading-box">
          <div className="spinner"></div>
          <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>{message}</p>
        </div>
      );
    }

    function ErrorMessage({ message, onRetry }) {
      return (
        <div className="error-banner">
          <p className="error-title">⚠️ Service Exception</p>
          <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>{message}</p>
          {onRetry && <button type="button" className="btn-retry" onClick={onRetry}>🔄 Try Again</button>}
        </div>
      );
    }

    // --- 5. PAGES ---
    function HomePage({ onNavigate, onSelect }) {
      const [featured, setFeatured] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetchProductsFromApi().then(data => {
          setFeatured(data.slice(0, 4));
          setLoading(false);
        });
      }, []);

      const shop = () => {
        onNavigate('products');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div>
          <section className="hero-section">
            <div className="hero-badge">✨ Modern E-Commerce Platform</div>
            <h1 className="hero-title">Shop smarter. Live better.</h1>
            <p className="hero-subtitle">Discover quality products at great prices. From high-tech electronics to fine jewelry and fashion trends.</p>
            <button type="button" className="hero-cta-btn" onClick={shop}>
              <span>Shop Now</span><span>→</span>
            </button>
          </section>

          <section className="benefits-grid">
            <div className="benefit-card"><div className="benefit-icon">🚀</div><div><h3 className="benefit-title">Fast Global Shipping</h3><p className="benefit-desc">Free express delivery on orders over $50</p></div></div>
            <div className="benefit-card"><div className="benefit-icon">🛡️</div><div><h3 className="benefit-title">Buyer Protection</h3><p className="benefit-desc">30-day money-back guarantee policy</p></div></div>
            <div className="benefit-card"><div className="benefit-icon">⚡</div><div><h3 className="benefit-title">Live API Sync</h3><p className="benefit-desc">Real-time inventory and pricing updates</p></div></div>
            <div className="benefit-card"><div className="benefit-icon">🔒</div><div><h3 className="benefit-title">Secure Checkout</h3><p className="benefit-desc">Encrypted transactions & zero fees</p></div></div>
          </section>

          <section style={{ marginBottom: '3.5rem' }}>
            <div className="section-header">
              <div>
                <h2 className="section-title">Featured Collections</h2>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Handpicked trending items updated in real time</p>
              </div>
              <button type="button" className="category-btn active" onClick={shop}>View All Catalog →</button>
            </div>
            {loading ? <Loading message="Loading featured items..." /> : <ProductGrid products={featured} onSelect={onSelect} />}
          </section>
        </div>
      );
    }

    function ProductsPage({ onSelect }) {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [sortBy, setSortBy] = useState('default');

      useEffect(() => {
        fetchProductsFromApi().then(data => {
          setProducts(data);
          setLoading(false);
        });
      }, []);

      const filtered = useMemo(() => {
        return products.filter(p => {
          const matchSearch = !searchQuery.trim() || p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.category.toLowerCase().includes(searchQuery.toLowerCase());
          const matchCat = selectedCategory === 'all' || p.category.toLowerCase() === selectedCategory.toLowerCase();
          return matchSearch && matchCat;
        });
      }, [products, searchQuery, selectedCategory]);

      const sorted = useMemo(() => sortProducts(filtered, sortBy), [filtered, sortBy]);

      return (
        <div>
          <div className="section-header">
            <div>
              <h1 className="section-title">Product Catalog</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Explore our collection of {products.length} products</p>
            </div>
          </div>

          <div className="filter-container">
            <div className="filter-row">
              <div className="search-box">
                <span className="search-icon-inside">🔍</span>
                <input type="text" className="search-input" placeholder="Search products by title or category..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <label style={{ fontSize: '0.85rem', color: 'var(--text-muted)', fontWeight: 600 }}>Sort By:</label>
                <select className="sort-select" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                  <option value="default">Default</option>
                  <option value="price-low-high">Price: Low to High</option>
                  <option value="price-high-low">Price: High to Low</option>
                  <option value="rating-high">Rating: Highest First</option>
                  <option value="name-asc">Name: A-Z</option>
                </select>
              </div>
            </div>
            <div className="category-pills">
              {[
                { label: 'All Products', value: 'all' },
                { label: 'Electronics', value: 'electronics' },
                { label: 'Jewelry', value: 'jewelry' },
                { label: "Men's Clothing", value: "men's clothing" },
                { label: "Women's Clothing", value: "women's clothing" }
              ].map(c => (
                <button key={c.value} type="button" className={`category-btn ${selectedCategory === c.value ? 'active' : ''}`} onClick={() => setSelectedCategory(c.value)}>
                  {c.label}
                </button>
              ))}
            </div>
          </div>

          {loading ? <Loading message="Fetching live product catalog..." /> : <ProductGrid products={sorted} onSelect={onSelect} />}
        </div>
      );
    }

    function ProductDetailsPage({ productId, onNavigate }) {
      const { addToCart } = useCart();
      const [product, setProduct] = useState(null);
      const [quantity, setQuantity] = useState(1);
      const [loading, setLoading] = useState(true);
      const [added, setAdded] = useState(false);

      useEffect(() => {
        fetchProductByIdFromApi(productId).then(data => {
          setProduct(data);
          setLoading(false);
        });
      }, [productId]);

      if (loading) return <Loading message="Loading product details..." />;
      if (!product) return <ErrorMessage message="Product not found." onRetry={() => onNavigate('products')} />;

      const add = () => {
        addToCart(product, quantity);
        setAdded(true);
        setTimeout(() => setAdded(false), 3000);
      };

      return (
        <div>
          <button type="button" className="category-btn" onClick={() => onNavigate('products')} style={{ marginBottom: '1.5rem' }}>← Back to Catalog</button>
          <div className="product-details-container">
            <div className="details-image-wrapper">
              <img src={product.image} alt={product.title} className="details-image" />
            </div>
            <div className="details-info">
              <span className="details-category">{product.category}</span>
              <h1 className="details-title">{product.title}</h1>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                <span style={{ fontSize: '1rem', color: 'var(--accent-amber)', fontWeight: 600 }}>{formatRating(product.rating)}</span>
                <span style={{ color: 'var(--text-subtle)', fontSize: '0.85rem' }}>({product.rating?.count || 0} reviews)</span>
              </div>
              <div className="details-price">{formatCurrency(product.price)}</div>
              <p className="details-description">{product.description}</p>
              <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '1.25rem' }}>
                <label style={{ fontSize: '0.9rem', fontWeight: 600, color: 'var(--text-muted)' }}>Quantity:</label>
                <div className="quantity-controls">
                  <button type="button" className="qty-btn" onClick={() => setQuantity(q => Math.max(1, q - 1))}>-</button>
                  <span className="qty-display">{quantity}</span>
                  <button type="button" className="qty-btn" onClick={() => setQuantity(q => q + 1)}>+</button>
                  <button type="button" className="hero-cta-btn" onClick={add} style={{ padding: '0.75rem 1.75rem', fontSize: '0.95rem', borderRadius: 'var(--radius-md)' }}>
                    🛒 Add to Cart ({formatCurrency(product.price * quantity)})
                  </button>
                </div>
                {added && <p style={{ color: 'var(--success)', fontSize: '0.9rem', fontWeight: 600, marginTop: '0.75rem' }}>✓ Added {quantity} item(s) to cart!</p>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CartPage({ onNavigate }) {
      const { cartItems, totalItems, subtotalPrice, increaseQuantity, decreaseQuantity, removeFromCart, clearCart } = useCart();
      const [placed, setPlaced] = useState(false);

      const shipping = subtotalPrice > 50 || subtotalPrice === 0 ? 0 : 9.99;
      const tax = subtotalPrice * 0.08;
      const total = subtotalPrice + shipping + tax;

      if (placed) {
        return (
          <div className="hero-section" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
            <span style={{ fontSize: '4rem' }}>🎉</span>
            <h1 className="hero-title" style={{ marginTop: '1rem' }}>Order Placed Successfully!</h1>
            <p className="hero-subtitle">Thank you for shopping with ShopSphere. Your order has been placed in demo mode.</p>
            <button type="button" className="hero-cta-btn" onClick={() => onNavigate('products')}>Continue Shopping →</button>
          </div>
        );
      }

      if (cartItems.length === 0) {
        return (
          <div className="hero-section" style={{ textAlign: 'center', padding: '4rem 2rem' }}>
            <span style={{ fontSize: '4rem' }}>🛒</span>
            <h1 className="hero-title" style={{ marginTop: '1rem' }}>Your Cart is Empty</h1>
            <p className="hero-subtitle">Looks like you haven't added any products to your cart yet.</p>
            <button type="button" className="hero-cta-btn" onClick={() => onNavigate('products')}>Browse Catalog →</button>
          </div>
        );
      }

      return (
        <div>
          <div className="section-header">
            <div>
              <h1 className="section-title">Your Shopping Cart</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Review {totalItems} item(s) in your cart</p>
            </div>
            <button type="button" className="category-btn" onClick={clearCart} style={{ color: 'var(--danger)' }}>Clear Cart 🗑️</button>
          </div>
          <div className="cart-layout">
            <div className="cart-items-list">
              {cartItems.map(item => (
                <div key={item.id} className="cart-item-card">
                  <img src={item.image} alt={item.title} className="cart-item-img" />
                  <div className="cart-item-details">
                    <h4 className="cart-item-title">{item.title}</h4>
                    <p className="cart-item-price">{formatCurrency(item.price)} each</p>
                  </div>
                  <div className="quantity-controls">
                    <button type="button" className="qty-btn" onClick={() => decreaseQuantity(item.id)}>-</button>
                    <span className="qty-display">{item.quantity}</span>
                    <button type="button" className="qty-btn" onClick={() => increaseQuantity(item.id)}>+</button>
                  </div>
                  <div style={{ textAlign: 'right', minWidth: '90px' }}>
                    <p style={{ fontWeight: 800, fontSize: '1.1rem', color: 'var(--text-main)' }}>{formatCurrency(item.price * item.quantity)}</p>
                    <button type="button" onClick={() => removeFromCart(item.id)} style={{ color: 'var(--danger)', fontSize: '0.85rem', marginTop: '0.25rem', cursor: 'pointer' }}>Remove 🗑️</button>
                  </div>
                </div>
              ))}
            </div>

            <div className="cart-summary-card">
              <h3 className="section-title" style={{ fontSize: '1.3rem' }}>Order Summary</h3>
              <div className="summary-row"><span>Subtotal ({totalItems} items)</span><span>{formatCurrency(subtotalPrice)}</span></div>
              <div className="summary-row"><span>Estimated Shipping</span><span>{shipping === 0 ? 'FREE' : formatCurrency(shipping)}</span></div>
              <div className="summary-row"><span>Estimated Tax (8%)</span><span>{formatCurrency(tax)}</span></div>
              <div className="summary-row total"><span>Total</span><span>{formatCurrency(total)}</span></div>
              <button type="button" className="btn-checkout" onClick={() => { setPlaced(true); clearCart(); }}>Proceed to Demo Checkout →</button>
              <button type="button" className="category-btn" onClick={() => onNavigate('products')} style={{ width: '100%', textAlign: 'center', marginTop: '0.5rem' }}>← Continue Shopping</button>
            </div>
          </div>
        </div>
      );
    }

    function AboutPage({ onNavigate }) {
      return (
        <div>
          <section className="hero-section">
            <div className="hero-badge">🌐 Academic Capstone Project</div>
            <h1 className="hero-title">About ShopSphere</h1>
            <p className="hero-subtitle">ShopSphere is a full-stack e-commerce web application engineered to demonstrate modern frontend architecture, state management, and API integration.</p>
          </section>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.75rem', marginBottom: '3rem' }}>
            <div className="benefit-card"><div className="benefit-icon">🧩</div><div><h3 className="benefit-title">Modular Architecture</h3><p className="benefit-desc">Clean component hierarchy separating logic, views, and state.</p></div></div>
            <div className="benefit-card"><div className="benefit-icon">🔄</div><div><h3 className="benefit-title">Client-Side Routing</h3><p className="benefit-desc">Instant single-page navigation without page reloads.</p></div></div>
            <div className="benefit-card"><div className="benefit-icon">💾</div><div><h3 className="benefit-title">State Persistence</h3><p className="benefit-desc">Global React Context synced automatically with LocalStorage.</p></div></div>
            <div className="benefit-card"><div className="benefit-icon">📡</div><div><h3 className="benefit-title">REST API & Fallbacks</h3><p className="benefit-desc">Fake Store REST API integration backed by offline data fallback.</p></div></div>
          </div>
          <div style={{ textAlign: 'center', margin: '3rem 0' }}>
            <button type="button" className="hero-cta-btn" onClick={() => onNavigate('products')}>Explore Catalog →</button>
          </div>
        </div>
      );
    }

    function NotFoundPage({ onNavigate }) {
      return (
        <div className="hero-section" style={{ textAlign: 'center', padding: '5rem 2rem' }}>
          <span style={{ fontSize: '4.5rem' }}>🔍 404</span>
          <h1 className="hero-title" style={{ marginTop: '1rem' }}>Page Not Found</h1>
          <p className="hero-subtitle">Oops! The page you are looking for doesn't exist.</p>
          <button type="button" className="hero-cta-btn" onClick={() => onNavigate('home')}>Back to Home →</button>
        </div>
      );
    }

    // --- 6. MASTER APP ---
    function App() {
      const [activePage, setActivePage] = useState('home');
      const [selectedProductId, setSelectedProductId] = useState(null);

      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash.replace(/^#\/?/, '');
          if (!hash || hash === 'home') setActivePage('home');
          else if (hash === 'products') setActivePage('products');
          else if (hash.startsWith('products/')) {
            setSelectedProductId(hash.split('/')[1]);
            setActivePage('product-details');
          }
          else if (hash === 'cart') setActivePage('cart');
          else if (hash === 'about') setActivePage('about');
          else setActivePage('404');
        };

        handleHash();
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const navigateTo = (page, pid = null) => {
        if (page === 'product-details' && pid) {
          setSelectedProductId(pid);
          setActivePage('product-details');
          window.location.hash = `#/products/${pid}`;
        } else {
          setActivePage(page);
          window.location.hash = `#/${page}`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <CartProvider>
          <div className="app-container">
            <Navbar activePage={activePage} onNavigate={navigateTo} />
            <main className="main-content">
              {activePage === 'home' && <HomePage onNavigate={navigateTo} onSelect={(id) => navigateTo('product-details', id)} />}
              {activePage === 'products' && <ProductsPage onSelect={(id) => navigateTo('product-details', id)} />}
              {activePage === 'product-details' && <ProductDetailsPage productId={selectedProductId} onNavigate={navigateTo} />}
              {activePage === 'cart' && <CartPage onNavigate={navigateTo} />}
              {activePage === 'about' && <AboutPage onNavigate={navigateTo} />}
              {activePage === '404' && <NotFoundPage onNavigate={navigateTo} />}
            </main>
            <Footer onNavigate={navigateTo} />
          </div>
        </CartProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
